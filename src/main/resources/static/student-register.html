<!DOCTYPE html>
<html>
<head>
    <title>QuizWiz - Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>QuizWiz</h1>

    <div class="card">

        <h2>Student Registration</h2>

        <label>Name</label>
        <input
                type="text"
                id="name"
                placeholder="Enter student name">

        <br><br>

        <label>Email</label>
        <input
                type="email"
                id="email"
                placeholder="Enter email">

        <br><br>

        <label>Register Number</label>
        <input
                type="text"
                id="registerNumber"
                placeholder="Enter register number">

        <br>

        <button onclick="registerStudent()">
            Register Student
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="student-register.js"></script>

</body>
</html>
