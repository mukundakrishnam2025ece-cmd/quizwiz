<!DOCTYPE html>
<html>
<head>
    <title>QuizWiz - Take Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>QuizWiz</h1>

    <div class="card">

        <h2 id="quizTitle">Loading quiz...</h2>

        <p id="quizDescription"></p>

        <p>
            Time Remaining:
            <strong id="timer">Loading...</strong>
        </p>

        <div id="questions"></div>

        <button onclick="submitQuiz()">Submit Quiz</button>

        <p id="result"></p>

    </div>

</div>

<script src="quiz.js"></script>

</body>
</html>
