<!DOCTYPE html>
<html>
<head>
    <title>QuizWiz - Add Question</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>QuizWiz</h1>

    <div class="card">

        <h2>Add Question</h2>

        <label>Quiz ID</label>
        <input type="number" id="quizId" placeholder="Enter Quiz ID">

        <br><br>

        <label>Question</label>
        <input type="text" id="questionText" placeholder="Enter question">

        <br><br>

        <label>Option A</label>
        <input type="text" id="optionA" placeholder="Enter option A">

        <br><br>

        <label>Option B</label>
        <input type="text" id="optionB" placeholder="Enter option B">

        <br><br>

        <label>Option C</label>
        <input type="text" id="optionC" placeholder="Enter option C">

        <br><br>

        <label>Option D</label>
        <input type="text" id="optionD" placeholder="Enter option D">

        <br><br>

        <label>Correct Option</label>
        <select id="correctOption">
            <option value="">Select correct option</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>

        <br>

        <button onclick="addQuestion()">
            Add Question
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="question.js"></script>

</body>
</html>
